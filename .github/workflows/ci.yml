name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 稳定版质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: YanXuLang/yanxu
          path: .yanxu-current
          ref: v1.1.8
      - name: 构建当前稳定言序
        run: cargo build --manifest-path .yanxu-current/Cargo.toml --locked --bin yanxu
      - name: 清单、权限与文档结构
        shell: sh
        run: |
          set -eu
          yanxu="$GITHUB_WORKSPACE/.yanxu-current/target/debug/yanxu"
          "$yanxu" 包 .
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f COMPATIBILITY.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/API.md
          test -f docs/GUIDE.md
          test -d examples
          test -d tests
          grep -F '网络 = []' 言序.toml
          grep -F 'TCP监听 = []' 言序.toml
          grep -F 'UDP绑定 = []' 言序.toml
          grep -F '进程 = false' 言序.toml
          grep -F '原生扩展 = false' 言序.toml
      - name: 格式、静态检查与 API 漂移
        shell: sh
        run: |
          set -eu
          yanxu="$GITHUB_WORKSPACE/.yanxu-current/target/debug/yanxu"
          find src tests examples benchmarks -type f -name '*.yx' -print | while IFS= read -r file; do
            "$yanxu" 格 "$file" | cmp - "$file"
            "$yanxu" 查 "$file"
          done
          "$yanxu" 文 src/言据.yx "$RUNNER_TEMP/API.md"
          cmp docs/API.md "$RUNNER_TEMP/API.md"
      - name: 规格、示例、锁图与发布构建
        shell: sh
        run: |
          set -eu
          yanxu="$GITHUB_WORKSPACE/.yanxu-current/target/debug/yanxu"
          "$yanxu" 试 tests --json
          for file in tests/*.yx; do "$yanxu" 字节 "$file"; done
          "$yanxu" 字节 examples/生成数据.yx
          "$yanxu" 字节 examples/读取配置.yx
          "$yanxu" 包 锁 examples/包调用
          "$yanxu" 包 运行 examples/包调用
          "$yanxu" 编 . -o "$RUNNER_TEMP/yanju-release.yxb" --release
          test -s "$RUNNER_TEMP/yanju-release.yxb"

  metadata:
    name: 新增元数据门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: 检查分支、PR 与新增提交
        shell: sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -eu
          if printf '%s\n%s\n%s\n' "$HEAD_BRANCH" "$PR_TITLE" "$PR_BODY" | grep -Eiq 'co[d]ex'; then
            echo '分支或 PR 元数据包含禁用词'
            exit 1
          fi
          if test -n "$BASE_SHA" && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git log "$BASE_SHA"..HEAD --format='%H%n%an%n%ae%n%cn%n%ce%n%s%n%b' | grep -Eiq 'co[d]ex'; then
              echo '新增提交元数据包含禁用词'
              exit 1
            fi
          fi

  unix:
    name: 言序 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: YanXuLang/yanxu
          path: .yanxu
          ref: v1.1.6
      - name: 构建言序 1.1.6
        run: cargo build --manifest-path .yanxu/Cargo.toml --locked --bin yanxu
      - name: 静态检查与规格测试
        shell: sh
        run: |
          yanxu="$GITHUB_WORKSPACE/.yanxu/target/debug/yanxu"
          "$yanxu" --version
          "$yanxu" 包 .
          for file in src/*.yx; do "$yanxu" 查 "$file"; done
          for file in tests/*.yx examples/*.yx; do "$yanxu" 查 "$file"; done
          for file in benchmarks/*.yx; do "$yanxu" 查 "$file"; done
          "$yanxu" 试 tests
          "$yanxu" 包 锁 examples/包调用
          "$yanxu" 包 运行 examples/包调用
          "$yanxu" compile . -o "$RUNNER_TEMP/yanju.yxb"
      - name: 字节码 VM 对照
        shell: sh
        run: |
          yanxu="$GITHUB_WORKSPACE/.yanxu/target/debug/yanxu"
          for file in tests/*.yx; do "$yanxu" 字节 "$file"; done
          "$yanxu" examples/生成数据.yx > "$RUNNER_TEMP/tree.txt"
          "$yanxu" 字节 examples/生成数据.yx > "$RUNNER_TEMP/vm.txt"
          diff -u "$RUNNER_TEMP/tree.txt" "$RUNNER_TEMP/vm.txt"

  windows:
    name: 言序 · windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: YanXuLang/yanxu
          path: .yanxu
          ref: v1.1.6
      - name: 构建言序 1.1.6
        run: cargo build --manifest-path .yanxu/Cargo.toml --locked --bin yanxu
      - name: 静态检查与规格测试
        shell: pwsh
        run: |
          $yanxu = Join-Path $env:GITHUB_WORKSPACE ".yanxu\target\debug\yanxu.exe"
          & $yanxu --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $yanxu 包 .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem src, tests, examples, benchmarks -Filter *.yx | ForEach-Object {
            & $yanxu 查 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $yanxu 试 tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $yanxu 包 锁 "examples/包调用"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $yanxu 包 运行 "examples/包调用"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $yanxu compile . -o (Join-Path $env:RUNNER_TEMP "yanju.yxb")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 字节码 VM 对照
        shell: pwsh
        run: |
          $yanxu = Join-Path $env:GITHUB_WORKSPACE ".yanxu\target\debug\yanxu.exe"
          Get-ChildItem tests -Filter *.yx | ForEach-Object {
            & $yanxu 字节 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
